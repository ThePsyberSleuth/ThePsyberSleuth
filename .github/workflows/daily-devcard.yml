# .github/workflows/daily-devcard.yml

name: Update daily.dev DevCard

on:
  # Run automatically every day at midnight
  schedule:
    - cron: "0 0 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Run on pushes to the main branch
  push:
    branches:
      - main

jobs:
  devcard:
    runs-on: ubuntu-latest
    permissions:
      # Required to commit the updated card to the repository
      contents: write
    steps:
      - name: Fetch Latest DevCard
        uses: dailydotdev/action-devcard@3.2.1
        with:
          # This pulls the secret you created
          user_id: ${{ secrets.USER_ID }}
          # The filename for the output image
          commit_filename: devcard.png
          # The commit message to use
          commit_message: "chore: update daily.dev devcard"
